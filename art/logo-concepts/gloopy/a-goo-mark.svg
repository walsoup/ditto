<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <title>Ditto: melting ditto mark</title>
  <rect width="108" height="108" fill="#2D6A4F"/>
  <!-- Each tick of the ditto mark melts into a thin drip with a drop on the end. -->
  <g stroke="#FAF9F6" stroke-linecap="round" fill="none">
    <path d="M46 35 L42 53" stroke-width="10"/>
    <path d="M62 35 L58 53" stroke-width="10"/>
    <path d="M42 53 Q40.6 59 41 64" stroke-width="4"/>
    <path d="M58 53 Q57.4 56 57.6 58" stroke-width="4"/>
  </g>
  <g fill="#FAF9F6">
    <circle cx="41" cy="67" r="4.4"/>
    <circle cx="57.6" cy="61" r="3.6"/>
  </g>
  <path d="M71 56 C72.6 59.6 75.8 62.2 75.8 66 A4.8 4.8 0 1 1 66.2 66 C66.2 62.2 69.4 59.6 71 56 Z" fill="#D47255"/>
</svg>
